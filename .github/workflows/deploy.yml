name: Deploy LexiconMeum Backend

on:
  workflow_dispatch:
    inputs:
      revision:
        description: "Version to build, without the leading v (e.g. 0.17.0)"
        required: true
  push:
    tags:
      - 'v*'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # A tag can be pushed onto any commit; only ship what is already on master.
      - name: Verify tag is on master
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          git fetch --no-tags origin master
          if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "Tag $GITHUB_REF_NAME is not on master. Refusing to deploy." >&2
            exit 1
          fi

      # Tag pushes carry the version in the tag name; manual runs supply it as an input.
      - name: Derive version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            REVISION="${{ inputs.revision }}"
          else
            REVISION="${GITHUB_REF_NAME#v}"
          fi
          if [ -z "$REVISION" ]; then
            echo "Could not determine version to build." >&2
            exit 1
          fi
          echo "Building version $REVISION"
          echo "revision=$REVISION" >> $GITHUB_OUTPUT

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_KEY }}

      - name: Add server to known hosts
        run: |
          ssh-keyscan -H ${{ secrets.VPS_IP_PROD }} >> ~/.ssh/known_hosts

      - name: Build JAR with Maven
        run: |
          mvn -B clean package -DskipTests -Drevision=${{ steps.ver.outputs.revision }}

      - name: Get JAR path
        id: jar
        run: |
          JAR_PATH=$(find target -type f -name "*.jar" | grep -v 'original-' | head -n 1)
          echo "jar_path=$JAR_PATH" >> $GITHUB_OUTPUT

      - name: Deploy to VPS with rollback support
        run: |
          JAR_PATH=${{ steps.jar.outputs.jar_path }}
          BASENAME=$(basename $JAR_PATH)
          REMOTE_USER=admin
          REMOTE_SERVER=${{ secrets.VPS_IP_PROD }}
          REMOTE_HOME_DIR="~"
          REMOTE_APP_DIR="/opt/lexiconmeum"

          # Upload to home dir
          rsync -avz -e "ssh" "$JAR_PATH" "$REMOTE_USER@$REMOTE_SERVER:$REMOTE_HOME_DIR/$BASENAME"

          # Move to root-owned app dir and update symlink
          ssh $REMOTE_USER@$REMOTE_SERVER << EOF
            sudo mv $REMOTE_HOME_DIR/$BASENAME $REMOTE_APP_DIR/$BASENAME
            sudo ln -sf $REMOTE_APP_DIR/$BASENAME $REMOTE_APP_DIR/lexiconmeum.jar
            sudo systemctl restart lexiconmeum.service
          EOF