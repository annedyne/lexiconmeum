spring:
  application:
    name: lexiconmeum

app:
  load:
    data-file: file:/opt/lexiconmeum/data/lexicalData.jsonl
    override-file: classpath:lexicalDataOverrides.jsonl
    parse-mode: LENIENT

  text-search:
    default-limit: 500
    result-limit-max: 500

api:
  base-path: /api/v1

springdoc:
  swagger-ui:
    path: /api/v1/swagger-ui
  api-docs:
    path: /api/v1/api-docs

server:
  forward-headers-strategy: native
  port: 8085

logging:
  level:
    root: INFO