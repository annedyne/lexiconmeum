spring:
  application:
    name: lexiconmeum

app:
  load:
    data-file: file:/opt/lexiconmeum/data/lexicalData.jsonl
    override-file: classpath:lexicalDataOverrides.jsonl
    parse-mode: LENIENT

  text-search:
    default-limit: 500
    result-limit-max: 500

api:
  base-path: /api/v1

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

server:
  forward-headers-strategy: native
  port: 8085

# Expose Actuator health api on separate loop-back port
management:
  server:
    port: 8086
    address: 127.0.0.1
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO